<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You've been unsubscribed</title>
<style>
  :root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --ink:#1c2530;
    --muted:#5f6b7a;
    --line:#e7eaee;
    --brand:#2656eb;
    --brand-soft:#e7edfd;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
  }
  .card{
    width:100%;
    max-width:460px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:40px 36px;
    text-align:center;
    box-shadow:0 12px 40px rgba(28,37,48,.06);
  }
  .icon{
    width:64px;
    height:64px;
    margin:0 auto 22px;
    border-radius:50%;
    background:var(--brand-soft);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon svg{stroke:var(--brand);}
  h1{
    font-size:22px;
    line-height:1.3;
    margin:0 0 12px;
    font-weight:650;
  }
  p{
    font-size:15px;
    line-height:1.6;
    color:var(--muted);
    margin:0 auto;
    max-width:340px;
  }
  .actions{
    margin-top:28px;
  }
  .btn{
    display:inline-block;
    width:100%;
    padding:13px 20px;
    border-radius:9999px;
    font-size:14px;
    font-weight:600;
    text-decoration:none;
    cursor:pointer;
    border:1px solid transparent;
    background:var(--brand);
    color:#fff;
    transition:background .15s ease;
  }
  .btn:hover{background:#1c46c9;}
  .btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  @media (max-width:400px){
    .card{padding:32px 22px;}
    h1{font-size:20px;}
  }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
    </div>

    <h1>You've been unsubscribed</h1>
    <p>You've been removed from this mailing list and won't receive any further emails from us.</p>
  </main>
</body>
</html>
